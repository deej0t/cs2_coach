# CS2 Coach — Portainer Stack fuer Unraid
#
# Voraussetzung: Image muss vorher gebaut werden:
#   cd /mnt/user/appdata/cs2-coach && docker build -t cs2-coach:latest .
#
# In Portainer: Stacks > Add stack > Web editor > diesen Inhalt einfuegen

services:
  # ── CS2 Coach Web-UI ──
  cs2-coach:
    image: cs2-coach:latest
    container_name: cs2-coach
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - CS2COACH_CONFIG=/data/config.yaml
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # Auto-Update Intervall in Sekunden (default: 21600 = 6h, 0 = aus)
      - CS2COACH_UPDATE_INTERVAL=21600
    volumes:
      # Config, Vault-Exports, CFGs — klein, darf auf dem Cache liegen
      - /mnt/user/appdata/cs2-coach/data:/data
      # Demos getrennt auf dem Array: eine Demo ist 40-330 MB, 60 Matches
      # belegen rund 14 GB. Unter appdata (Cache-only) laeuft die SSD voll.
      # Der Share cs2-demos sollte in Unraid auf "Use cache: No" stehen.
      - /mnt/user/cs2-demos:/data/demos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
