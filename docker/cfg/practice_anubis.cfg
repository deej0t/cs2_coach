alias "cs2c_s6" "setpos -905.4 1179.7 35.0; bot_add_t; echo ; echo === Spot 6/10: 1x deaths ===; echo Gegner: call you later (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s7"
alias "cs2c_s7" "setpos 1120.4 802.3 -149.0; bot_add_t; echo ; echo === Spot 7/10: 1x deaths ===; echo Gegner: call you later (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s8"
alias "cs2c_s8" "setpos 104.8 1149.8 -32.0; bot_add_t; echo ; echo === Spot 8/10: 1x deaths ===; echo Gegner: JoJo (glock); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s9"
alias "cs2c_s9" "setpos -595.6 726.7 38.0; bot_add_t; echo ; echo === Spot 9/10: 1x deaths ===; echo Gegner: 👑ReD™ (galilar); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s10"
alias "cs2c_s10" "setpos 1151.7 1440.8 -135.0; bot_add_t; echo ; echo === Spot 10/10: 1x deaths ===; echo Gegner: VLADSTR (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_setup_done"
alias "cs2c_setup_done" "echo ; echo Alle Spots besucht!; echo Druecke F4 um Practice zu starten.; alias cs2c_next cs2c_setup_done"
alias "cs2c_place" "bot_place; cs2c_next"

// ── Phase 2: Practice (Peek-Positionen) ──
alias "cs2c_p1" "setpos 1772.8 1776.8 -99.0; setang -1.1 -170.4 0; echo ; echo === Peek 1/10 ===; echo Du stirbst hier 2x - peeke Richtung Ruxica; echo Waffe: deagle; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -1257.0 -325.7 10.1; setang 0 nan 0; echo ; echo === Peek 2/10 ===; echo Du stirbst hier 1x - peeke Richtung ?; echo Waffe: planted_c4; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -1194.5 693.4 0.0; setang -0.1 -135.4 0; echo ; echo === Peek 3/10 ===; echo Du stirbst hier 1x - peeke Richtung call you later; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 1773.6 1914.5 -84.0; setang -2.8 161.8 0; echo ; echo === Peek 4/10 ===; echo Du stirbst hier 1x - peeke Richtung Ruxica; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos -83.5 -106.7 0.2; setang -0.0 -52.6 0; echo ; echo === Peek 5/10 ===; echo Du stirbst hier 1x - peeke Richtung VLADSTR; echo Waffe: m4a1; alias cs2c_peek cs2c_p6"
alias "cs2c_p6" "setpos -866.2 317.9 -56.0; setang -6.0 92.6 0; echo ; echo === Peek 6/10 ===; echo Du stirbst hier 1x - peeke Richtung call you later; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p7"
alias "cs2c_p7" "setpos 1355.0 414.9 0.0; setang 18.2 121.2 0; echo ; echo === Peek 7/10 ===; echo Du stirbst hier 1x - peeke Richtung call you later; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p8"
alias "cs2c_p8" "setpos 153.7 1580.4 -32.0; setang -0.0 -96.5 0; echo ; echo === Peek 8/10 ===; echo Du stirbst hier 1x - peeke Richtung JoJo; echo Waffe: glock; alias cs2c_peek cs2c_p9"
alias "cs2c_p9" "setpos -1781.7 207.3 0.0; setang -1.7 23.6 0; echo ; echo === Peek 9/10 ===; echo Du stirbst hier 1x - peeke Richtung 👑ReD™; echo Waffe: galilar; alias cs2c_peek cs2c_p10"
alias "cs2c_p10" "setpos 927.6 1438.0 -88.0; setang 11.8 0.7 0; echo ; echo === Peek 10/10 ===; echo Du stirbst hier 1x - peeke Richtung VLADSTR; echo Waffe: ak47; alias cs2c_peek cs2c_p1"

alias "cs2c_start" "bot_stop 1; mp_respawn_on_death_t 0; noclip; echo ; echo ======================================; echo  PRACTICE MODUS AKTIV; echo  Bots eingefroren - uebe deine Peeks!; echo  F2 = Naechste Peek-Position; echo  F6 = Reset; echo ======================================; echo ; bind F2 cs2c_peek; bind F4 cs2c_unfreeze; cs2c_p1"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo ; echo Bots AKTIV - viel Glueck!; echo F6 zum Reset"
alias "cs2c_reset" "bot_kick; mp_respawn_on_death_t 1; alias cs2c_next cs2c_s1; alias cs2c_peek cs2c_p1; bind F2 cs2c_next; bind F4 cs2c_start; noclip; echo ; echo Reset - druecke F2 fuer Spot 1"

alias cs2c_next cs2c_s1
alias cs2c_peek cs2c_p1

// ── Keybinds ──
bind "F2" "cs2c_next"
bind "F3" "cs2c_place"
bind "F4" "cs2c_start"
bind "F5" "noclip"
bind "F6" "cs2c_reset"

// ── Start: Noclip an, druecke F2 fuer Spot 1 ──
noclip

