// ═══════════════════════════════════════════════════
// CS2 Coach — Practice Config: Anubis
// Mode: Prefire Training
// Generated from 15 deaths + 31 kills
// 10 Bot-Spots from 14 Hotspots
// ═══════════════════════════════════════════════════

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1

// ── Clean Slate ──
bot_kick
mp_autoteambalance 0
mp_limitteams 0

// ── Phase 1: Bot-Placement (10 Spots) ──
// F2 = Naechster Spot (teleportiert zum Gegner-Spot)
// F3 = Bot platzieren + weiter
// F4 = Fertig → Practice starten
// F5 = Noclip an/aus
// F6 = Reset (alle Bots kicken, neu starten)

alias "cs2c_s1" "setpos 822.2 1615.7 -79.7; bot_add_t; echo ; echo === Spot 1/10: 2x deaths ===; echo Gegner: Ruxica (deagle); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s2"
alias "cs2c_s2" "setpos nan nan nan; bot_add_t; echo ; echo === Spot 2/10: 1x deaths ===; echo Gegner: ? (planted_c4); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s3"
alias "cs2c_s3" "setpos -1726.2 168.2 1.1; bot_add_t; echo ; echo === Spot 3/10: 1x deaths ===; echo Gegner: call you later (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s4"
alias "cs2c_s4" "setpos 919.5 2195.6 -40.0; bot_add_t; echo ; echo === Spot 4/10: 1x deaths ===; echo Gegner: Ruxica (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s5"
