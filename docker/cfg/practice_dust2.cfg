alias "cs2c_s8" "setpos 370.5 1535.7 2.4; bot_add_t; echo ; echo === Spot 8/10: 1x deaths ===; echo Gegner: Almazeet (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s9"
alias "cs2c_s9" "setpos -242.1 2278.9 -120.0; bot_add_t; echo ; echo === Spot 9/10: 1x deaths ===; echo Gegner: Almazeet (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s10"
alias "cs2c_s10" "setpos -2010.5 1447.7 32.3; bot_add_t; echo ; echo === Spot 10/10: 1x deaths ===; echo Gegner: HUNTER (famas); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_setup_done"
alias "cs2c_setup_done" "echo ; echo Alle Spots besucht!; echo Druecke F4 um Practice zu starten.; alias cs2c_next cs2c_setup_done"
alias "cs2c_place" "bot_place; cs2c_next"

// ── Phase 2: Practice (Peek-Positionen) ──
alias "cs2c_p1" "setpos 704.9 2444.2 86.7; setang -0.4 -120.6 0; echo ; echo === Peek 1/10 ===; echo Du stirbst hier 3x - peeke Richtung HUNTER; echo Waffe: ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 1727.1 1862.2 1.4; setang 0.0 -174.1 0; echo ; echo === Peek 2/10 ===; echo Du stirbst hier 2x - peeke Richtung LIFE TASHKENT; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 962.1 1790.0 48.6; setang -3.6 77.2 0; echo ; echo === Peek 3/10 ===; echo Du stirbst hier 2x - peeke Richtung Zalupkins; echo Waffe: m4a1; alias cs2c_peek cs2c_p4"
