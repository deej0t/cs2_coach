alias "cs2c_p6" "setpos -1188.8 2548.6 -21.4; setang -2.2 -124.7 0; echo ; echo === Peek 6/10 ===; echo Du stirbst hier 2x - peeke Richtung J bois Turnin GAZA to ZAZA; echo Waffe: usp_silencer; alias cs2c_peek cs2c_p7"
