alias "cs2c_p8" "setpos -156.3 1308.3 0.1; setang -0.2 23.3 0; echo ; echo === Peek 8/10 ===; echo Du stirbst hier 1x - peeke Richtung Almazeet; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p9"
alias "cs2c_p9" "setpos -429.5 1622.7 -125.9; setang -0.5 74.1 0; echo ; echo === Peek 9/10 ===; echo Du stirbst hier 1x - peeke Richtung Almazeet; echo Waffe: ak47; alias cs2c_peek cs2c_p10"
alias "cs2c_p10" "setpos -1728.1 1191.7 31.5; setang -0.1 137.8 0; echo ; echo === Peek 10/10 ===; echo Du stirbst hier 1x - peeke Richtung HUNTER; echo Waffe: famas; alias cs2c_peek cs2c_p1"

alias "cs2c_start" "bot_stop 1; mp_respawn_on_death_t 0; noclip; echo ; echo ======================================; echo  PRACTICE MODUS AKTIV; echo  Bots eingefroren - uebe deine Peeks!; echo  F2 = Naechste Peek-Position; echo  F6 = Reset; echo ======================================; echo ; bind F2 cs2c_peek; bind F4 cs2c_unfreeze; cs2c_p1"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo ; echo Bots AKTIV - viel Glueck!; echo F6 zum Reset"
alias "cs2c_reset" "bot_kick; mp_respawn_on_death_t 1; alias cs2c_next cs2c_s1; alias cs2c_peek cs2c_p1; bind F2 cs2c_next; bind F4 cs2c_start; noclip; echo ; echo Reset - druecke F2 fuer Spot 1"

alias cs2c_next cs2c_s1
alias cs2c_peek cs2c_p1

// ── Keybinds ──
bind "F2" "cs2c_next"
bind "F3" "cs2c_place"
bind "F4" "cs2c_start"
bind "F5" "noclip"
bind "F6" "cs2c_reset"

// ── Start: Noclip an, druecke F2 fuer Spot 1 ──
noclip

