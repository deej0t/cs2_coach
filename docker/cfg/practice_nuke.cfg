// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1

// ── Clean Slate ──
