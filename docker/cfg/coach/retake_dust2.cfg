// =======================================================
// CS2 Coach — Dust2 RETAKE
// 3 Bots an gegnerischen Hold-Positionen
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (CT-Seite: verteidigen Positionen) ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 0

bot_add_ct
bot_add_ct
bot_add_ct

bot_stop 1

// ── Auto-Setup: 3 Hold-Positionen ──
alias "cs2c_ab1" "setpos 576.8 810.5 1.3; bot_place; echo [Bot 1/3] 5x — S1lent (ak47); cs2c_ab2"
alias "cs2c_ab2" "setpos -1933.3 1321.6 33.3; bot_place; echo [Bot 2/3] 4x — Дуб (awp); cs2c_ab3"
alias "cs2c_ab3" "setpos 1273.7 2614.9 92.3; bot_place; echo [Bot 3/3] 3x — C4ST0R (ak47); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos 1078.9 535.6 22.9; setang 2.2 151.3 0; bind F2 cs2c_peek; bot_stop 0; bot_dont_shoot 0; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (deine Entry-Points) ──
alias "cs2c_p1" "setpos 1078.9 535.6 22.9; setang 2.2 151.3 0; echo ; echo ══ Peek 1/3: 5x deaths ══; echo Gegner: S1lent mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -1526.0 1797.6 2.8; setang -2.8 -130.6 0; echo ; echo ══ Peek 2/3: 4x deaths ══; echo Gegner: Дуб mit awp; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 502.0 2463.0 96.3; setang 0.3 11.1 0; echo ; echo ══ Peek 3/3: 3x deaths ══; echo Gegner: C4ST0R mit ak47; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/retake_dust2"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " RETAKE: Dust2 — 3 Bots"
echo " Bots halten Positionen — retake!"
echo " F2=Setup  F3=Toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
