// =======================================================
// CS2 Coach — Nuke CHALLENGE (Speed-Run)
// 5 Bots — 40 Sekunden — schaff sie alle!
// =======================================================

// ── Server Setup (kurzer Timer!) ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 40
mp_roundtime_defuse 40
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (aktiv, Expert) ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 0

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 5 Spots + UNFREEZE ──
alias "cs2c_ab1" "setpos 999.2 -351.8 -128.0; bot_place; echo [Bot 1/5]; cs2c_ab2"
alias "cs2c_ab2" "setpos 451.7 -1363.9 -425.5; bot_place; echo [Bot 2/5]; cs2c_ab3"
alias "cs2c_ab3" "setpos 694.3 -1540.4 -415.8; bot_place; echo [Bot 3/5]; cs2c_ab4"
alias "cs2c_ab4" "setpos 656.5 -2397.0 -416.0; bot_place; echo [Bot 4/5]; cs2c_ab5"
alias "cs2c_ab5" "setpos 202.2 -1277.8 -416.0; bot_place; echo [Bot 5/5]; cs2c_challenge_go"
alias "cs2c_challenge_go" "noclip; setpos 522.3 -1270.7 -416.0; setang -15.5 62.6 0; bot_stop 0; bot_dont_shoot 0; mp_restartgame 1; echo ; echo ══════ CHALLENGE START ══════; echo 5 Bots — 40 Sekunden — GO GO GO!; bind F2 cs2c_peek"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (Hilfe) ──
alias "cs2c_p1" "setpos 522.3 -1270.7 -416.0; setang -15.5 62.6 0; echo ; echo ══ Peek 1/5: 9x deaths ══; echo Gegner: St1ds3n mit usp_silencer; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 326.7 -1036.0 -344.4; setang 13.0 -69.1 0; echo ; echo ══ Peek 2/5: 8x deaths ══; echo Gegner: LeerGutLars mit m4a1_silencer; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 485.1 -1166.8 -410.6; setang 0.7 -60.8 0; echo ; echo ══ Peek 3/5: 7x deaths ══; echo Gegner: ꧁☆ɃŁȺȻꝀ MȺMɃȺ☆꧂ mit awp; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 1735.2 -1724.3 -415.9; setang 0.0 -148.1 0; echo ; echo ══ Peek 4/5: 6x deaths ══; echo Gegner: FLÆK mit ak47; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos 96.8 -1228.9 -407.3; setang 4.3 -24.9 0; echo ; echo ══ Peek 5/5: 5x deaths ══; echo Gegner: 76561198243559908 mit m4a1; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/challenge_nuke"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " CHALLENGE: Nuke — 5 Bots"
echo " 40 Sekunden — Bots schiessen zurueck!"
echo " F2=Setup+Start  F5=Reset"
echo ""
echo " Schwierigkeit: cs2c_easy..cs2c_expert"
echo "══════════════════════════════════════"
echo ""
