// =======================================================
// CS2 Coach — Inferno CHALLENGE (Speed-Run)
// 5 Bots — 45 Sekunden — schaff sie alle!
// =======================================================

// ── Server Setup (kurzer Timer!) ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 45
mp_roundtime_defuse 45
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (aktiv, Expert) ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 0

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 5 Spots + UNFREEZE ──
alias "cs2c_ab1" "setpos 1351.3 485.7 122.3; bot_place; echo [Bot 1/5]; cs2c_ab2"
alias "cs2c_ab2" "setpos 2027.7 -164.1 266.2; bot_place; echo [Bot 2/5]; cs2c_ab3"
alias "cs2c_ab3" "setpos 1973.4 186.8 153.1; bot_place; echo [Bot 3/5]; cs2c_ab4"
alias "cs2c_ab4" "setpos 786.9 2123.8 136.8; bot_place; echo [Bot 4/5]; cs2c_ab5"
alias "cs2c_ab5" "setpos 706.3 2423.0 140.7; bot_place; echo [Bot 5/5]; cs2c_challenge_go"
alias "cs2c_challenge_go" "noclip; setpos 309.3 588.2 94.0; setang -1.5 -5.6 0; bot_stop 0; bot_dont_shoot 0; mp_restartgame 1; echo ; echo ══════ CHALLENGE START ══════; echo 5 Bots — 45 Sekunden — GO GO GO!; bind F2 cs2c_peek"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (Hilfe) ──
alias "cs2c_p1" "setpos 309.3 588.2 94.0; setang -1.5 -5.6 0; echo ; echo ══ Peek 1/5: 7x deaths ══; echo Gegner: - Ĵ ų b i - mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 2067.8 525.2 153.8; setang -9.2 -93.3 0; echo ; echo ══ Peek 2/5: 4x deaths ══; echo Gegner: ShoT8D mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 2399.6 1068.7 162.0; setang 0.5 -115.8 0; echo ; echo ══ Peek 3/5: 4x deaths ══; echo Gegner: ShoT8D mit ssg08; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 546.1 3006.4 156.5; setang 1.2 -74.7 0; echo ; echo ══ Peek 4/5: 4x deaths ══; echo Gegner: ŋocry _ mit awp; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos 543.9 2678.1 161.5; setang 3.9 -57.5 0; echo ; echo ══ Peek 5/5: 3x deaths ══; echo Gegner: Rääpäle mit m4a1_silencer; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/challenge_inferno"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " CHALLENGE: Inferno — 5 Bots"
echo " 45 Sekunden — Bots schiessen zurueck!"
echo " F2=Setup+Start  F5=Reset"
echo ""
echo " Schwierigkeit: cs2c_easy..cs2c_expert"
echo "══════════════════════════════════════"
echo ""
