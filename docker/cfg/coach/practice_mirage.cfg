// =======================================================
// CS2 Coach — Mirage PREFIRE (Auto-Setup)
// 5 Bots aus 167 Deaths + 212 Kills
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 1

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 5 Spots ──
alias "cs2c_ab1" "setpos -799.3 92.2 -169.2; bot_place; echo [Bot 1/5] 9x — Sensei Bensis (awp); cs2c_ab2"
alias "cs2c_ab2" "setpos -1180.4 -641.1 -163.7; bot_place; echo [Bot 2/5] 9x — Arghh (ak47); cs2c_ab3"
alias "cs2c_ab3" "setpos -1981.8 752.0 -39.2; bot_place; echo [Bot 3/5] 6x — Bandit (glock); cs2c_ab4"
alias "cs2c_ab4" "setpos -1242.3 -1227.7 -168.0; bot_place; echo [Bot 4/5] 5x — Arghh (awp); cs2c_ab5"
alias "cs2c_ab5" "setpos -250.5 -2225.2 -168.3; bot_place; echo [Bot 5/5] 4x — Pourfendeur2Blyat (m4a1_silencer); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos -1567.1 134.3 -159.6; setang 0.7 -3.1 0; bind F2 cs2c_peek; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen ──
alias "cs2c_p1" "setpos -1567.1 134.3 -159.6; setang 0.7 -3.1 0; echo ; echo ══ Peek 1/5: 9x deaths ══; echo Gegner: Sensei Bensis mit awp; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -187.8 -590.8 -205.4; setang -2.4 -177.1 0; echo ; echo ══ Peek 2/5: 9x deaths ══; echo Gegner: Arghh mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -1989.4 465.2 -156.1; setang -22.2 88.5 0; echo ; echo ══ Peek 3/5: 6x deaths ══; echo Gegner: Bandit mit glock; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos -500.3 -1754.5 -116.8; setang 3.2 144.6 0; echo ; echo ══ Peek 4/5: 5x deaths ══; echo Gegner: Arghh mit awp; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos -413.3 -1789.8 -142.5; setang 3.2 -69.5 0; echo ; echo ══ Peek 5/5: 4x deaths ══; echo Gegner: Pourfendeur2Blyat mit m4a1_silencer; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/practice_mirage"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " PREFIRE: Mirage — 5 Bots"
echo " F2=Auto-Setup → Peek-Zyklus"
echo " F3=Bots toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
