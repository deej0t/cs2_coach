// =======================================================
// CS2 Coach — Cache RETAKE
// 5 Bots an gegnerischen Hold-Positionen
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (CT-Seite: verteidigen Positionen) ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 0

bot_add_ct
bot_add_ct
bot_add_ct
bot_add_ct
bot_add_ct

bot_stop 1

// ── Auto-Setup: 5 Hold-Positionen ──
alias "cs2c_ab1" "setpos -325.8 -31.4 1658.4; bot_place; echo [Bot 1/5] 9x — Avin (ak47); cs2c_ab2"
alias "cs2c_ab2" "setpos -513.1 -670.8 1796.1; bot_place; echo [Bot 2/5] 9x — ubbe (ak47); cs2c_ab3"
alias "cs2c_ab3" "setpos 813.4 241.2 1612.0; bot_place; echo [Bot 3/5] 9x — _Bulkcich_ (m4a1); cs2c_ab4"
alias "cs2c_ab4" "setpos 1019.2 212.3 1612.0; bot_place; echo [Bot 4/5] 8x — le da :D (awp); cs2c_ab5"
alias "cs2c_ab5" "setpos 539.6 -240.5 1748.0; bot_place; echo [Bot 5/5] 7x — hai vai (ak47); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos -38.8 428.5 1626.5; setang -3.4 -122.0 0; bind F2 cs2c_peek; bot_stop 0; bot_dont_shoot 0; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (deine Entry-Points) ──
alias "cs2c_p1" "setpos -38.8 428.5 1626.5; setang -3.4 -122.0 0; echo ; echo ══ Peek 1/5: 9x deaths ══; echo Gegner: Avin mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 186.9 -929.1 1640.3; setang -11.8 159.7 0; echo ; echo ══ Peek 2/5: 9x deaths ══; echo Gegner: ubbe mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -266.8 234.4 1665.7; setang 2.8 0.4 0; echo ; echo ══ Peek 3/5: 9x deaths ══; echo Gegner: _Bulkcich_ mit m4a1; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos -196.3 240.8 1660.2; setang 2.3 -1.3 0; echo ; echo ══ Peek 4/5: 8x deaths ══; echo Gegner: le da :D mit awp; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos 271.6 -205.3 1638.6; setang -22.0 -7.5 0; echo ; echo ══ Peek 5/5: 7x deaths ══; echo Gegner: hai vai mit ak47; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/retake_cache"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " RETAKE: Cache — 5 Bots"
echo " Bots halten Positionen — retake!"
echo " F2=Setup  F3=Toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
