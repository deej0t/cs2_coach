// =======================================================
// CS2 Coach — Anubis PREFIRE (Auto-Setup)
// 4 Bots aus 31 Deaths + 46 Kills
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 1

bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 4 Spots ──
alias "cs2c_ab1" "setpos -920.9 1108.2 35.0; bot_place; echo [Bot 1/4] 4x — ✪cpl.1337 (ak47); cs2c_ab2"
alias "cs2c_ab2" "setpos -1764.4 163.2 20.2; bot_place; echo [Bot 2/4] 3x — SΛVΛGEJR (awp); cs2c_ab3"
alias "cs2c_ab3" "setpos 1184.0 1451.1 -139.8; bot_place; echo [Bot 3/4] 2x — • Đ Ɇ S P ₳ 「破壊者 (ak47); cs2c_ab4"
alias "cs2c_ab4" "setpos -232.2 -342.0 0.3; bot_place; echo [Bot 4/4] 2x — ✪cpl.1337 (awp); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos -913.9 541.7 -5.8; setang -4.1 90.7 0; bind F2 cs2c_peek; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen ──
alias "cs2c_p1" "setpos -913.9 541.7 -5.8; setang -4.1 90.7 0; echo ; echo ══ Peek 1/4: 4x deaths ══; echo Gegner: ✪cpl.1337 mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -998.8 914.8 18.9; setang -0.1 -135.5 0; echo ; echo ══ Peek 2/4: 3x deaths ══; echo Gegner: SΛVΛGEJR mit awp; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 847.2 1556.5 -68.0; setang 11.5 -17.4 0; echo ; echo ══ Peek 3/4: 2x deaths ══; echo Gegner: • Đ Ɇ S P ₳ 「破壊者 mit ak47; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos -62.4 567.1 0.3; setang -0.0 -100.6 0; echo ; echo ══ Peek 4/4: 2x deaths ══; echo Gegner: ✪cpl.1337 mit awp; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/practice_anubis"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " PREFIRE: Anubis — 4 Bots"
echo " F2=Auto-Setup → Peek-Zyklus"
echo " F3=Bots toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
