// =======================================================
// CS2 Coach — Vertigo PREFIRE (Auto-Setup)
// 3 Bots aus 8 Deaths + 12 Kills
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 1

bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 3 Spots ──
alias "cs2c_ab1" "setpos -639.7 -730.7 11776.0; bot_place; echo [Bot 1/3] 1x — PDK (p250); cs2c_ab2"
alias "cs2c_ab2" "setpos -429.5 -730.2 11776.0; bot_place; echo [Bot 2/3] 1x — Sequence (xm1014); cs2c_ab3"
alias "cs2c_ab3" "setpos -1238.0 510.5 11818.0; bot_place; echo [Bot 3/3] 1x — PDK (fiveseven); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos -998.0 -215.5 11776.0; setang -0.0 -55.2 0; bind F2 cs2c_peek; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen ──
alias "cs2c_p1" "setpos -998.0 -215.5 11776.0; setang -0.0 -55.2 0; echo ; echo ══ Peek 1/3: 1x deaths ══; echo Gegner: PDK mit p250; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -51.0 -1283.5 11776.0; setang -0.0 124.4 0; echo ; echo ══ Peek 2/3: 1x deaths ══; echo Gegner: Sequence mit xm1014; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -1085.2 238.4 11776.0; setang -7.7 119.3 0; echo ; echo ══ Peek 3/3: 1x deaths ══; echo Gegner: PDK mit fiveseven; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/practice_vertigo"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " PREFIRE: Vertigo — 3 Bots"
echo " F2=Auto-Setup → Peek-Zyklus"
echo " F3=Bots toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
