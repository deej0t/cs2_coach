// =======================================================
// CS2 Coach — Dust2 PREFIRE (Auto-Setup)
// 4 Bots aus 45 Deaths + 70 Kills
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 1

bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 4 Spots ──
alias "cs2c_ab1" "setpos 342.9 1832.4 91.8; bot_place; echo [Bot 1/4] 3x — HUNTER (ak47); cs2c_ab2"
alias "cs2c_ab2" "setpos 1558.0 2005.2 -9.4; bot_place; echo [Bot 2/4] 2x — Lalwa (awp); cs2c_ab3"
alias "cs2c_ab3" "setpos 1284.1 1816.2 1.1; bot_place; echo [Bot 3/4] 2x — LIFE TASHKENT (m4a1_silencer); cs2c_ab4"
alias "cs2c_ab4" "setpos 1181.1 2752.8 111.2; bot_place; echo [Bot 4/4] 2x — Zalupkins (m4a1); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos 704.9 2444.2 86.7; setang -0.4 -120.6 0; bind F2 cs2c_peek; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen ──
alias "cs2c_p1" "setpos 704.9 2444.2 86.7; setang -0.4 -120.6 0; echo ; echo ══ Peek 1/4: 3x deaths ══; echo Gegner: HUNTER mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 188.7 2162.8 -57.7; setang -2.0 -6.6 0; echo ; echo ══ Peek 2/4: 2x deaths ══; echo Gegner: Lalwa mit awp; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 1727.1 1862.2 1.4; setang 0.0 -174.1 0; echo ; echo ══ Peek 3/4: 2x deaths ══; echo Gegner: LIFE TASHKENT mit m4a1_silencer; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 962.1 1790.0 48.6; setang -3.6 77.2 0; echo ; echo ══ Peek 4/4: 2x deaths ══; echo Gegner: Zalupkins mit m4a1; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/practice_dust2"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " PREFIRE: Dust2 — 4 Bots"
echo " F2=Auto-Setup → Peek-Zyklus"
echo " F3=Bots toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
