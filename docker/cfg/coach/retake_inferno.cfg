// =======================================================
// CS2 Coach — Inferno RETAKE
// 4 Bots an gegnerischen Hold-Positionen
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (CT-Seite: verteidigen Positionen) ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 0

bot_add_ct
bot_add_ct
bot_add_ct
bot_add_ct

bot_stop 1

// ── Auto-Setup: 4 Hold-Positionen ──
alias "cs2c_ab1" "setpos 1421.7 462.6 124.7; bot_place; echo [Bot 1/4] 7x — wert (m4a1_silencer); cs2c_ab2"
alias "cs2c_ab2" "setpos 2059.2 -203.1 256.0; bot_place; echo [Bot 2/4] 5x — Ⓡⓞⓑⓐ (ak47); cs2c_ab3"
alias "cs2c_ab3" "setpos 851.2 2100.7 136.1; bot_place; echo [Bot 3/4] 5x — NUDEL (ak47); cs2c_ab4"
alias "cs2c_ab4" "setpos 688.0 2544.3 157.3; bot_place; echo [Bot 4/4] 3x — Ⓡⓞⓑⓐ (usp_silencer); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos 896.1 611.3 157.4; setang 3.4 -15.8 0; bind F2 cs2c_peek; bot_stop 0; bot_dont_shoot 0; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (deine Entry-Points) ──
alias "cs2c_p1" "setpos 896.1 611.3 157.4; setang 3.4 -15.8 0; echo ; echo ══ Peek 1/4: 7x deaths ══; echo Gegner: wert mit m4a1_silencer; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 1873.0 470.6 173.9; setang -6.7 -74.6 0; echo ; echo ══ Peek 2/4: 5x deaths ══; echo Gegner: Ⓡⓞⓑⓐ mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 415.7 3023.8 161.7; setang 1.4 -64.7 0; echo ; echo ══ Peek 3/4: 5x deaths ══; echo Gegner: NUDEL mit ak47; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 432.4 2791.0 161.3; setang 0.6 -44.0 0; echo ; echo ══ Peek 4/4: 3x deaths ══; echo Gegner: Ⓡⓞⓑⓐ mit usp_silencer; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/retake_inferno"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " RETAKE: Inferno — 4 Bots"
echo " Bots halten Positionen — retake!"
echo " F2=Setup  F3=Toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
