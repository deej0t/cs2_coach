// =======================================================
// CS2 Coach — Ancient CHALLENGE (Speed-Run)
// 6 Bots — 60 Sekunden — schaff sie alle!
// =======================================================

// ── Server Setup (kurzer Timer!) ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (aktiv, Expert) ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 0

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 6 Spots + UNFREEZE ──
alias "cs2c_ab1" "setpos 1280.6 -275.3 106.9; bot_place; echo [Bot 1/6]; cs2c_ab2"
alias "cs2c_ab2" "setpos -2084.4 445.2 75.9; bot_place; echo [Bot 2/6]; cs2c_ab3"
alias "cs2c_ab3" "setpos -181.7 -714.8 159.4; bot_place; echo [Bot 3/6]; cs2c_ab4"
alias "cs2c_ab4" "setpos 604.2 843.7 113.5; bot_place; echo [Bot 4/6]; cs2c_ab5"
alias "cs2c_ab5" "setpos -281.1 986.4 72.5; bot_place; echo [Bot 5/6]; cs2c_ab6"
alias "cs2c_ab6" "setpos 1335.8 -515.9 38.9; bot_place; echo [Bot 6/6]; cs2c_challenge_go"
alias "cs2c_challenge_go" "noclip; setpos 892.2 -317.8 92.8; setang -2.1 6.2 0; bot_stop 0; bot_dont_shoot 0; mp_restartgame 1; echo ; echo ══════ CHALLENGE START ══════; echo 6 Bots — 60 Sekunden — GO GO GO!; bind F2 cs2c_peek"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (Hilfe) ──
alias "cs2c_p1" "setpos 892.2 -317.8 92.8; setang -2.1 6.2 0; echo ; echo ══ Peek 1/6: 3x deaths ══; echo Gegner: Banu Manta mit galilar; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -1614.2 1022.8 69.0; setang -0.5 -129.1 0; echo ; echo ══ Peek 2/6: 3x deaths ══; echo Gegner: 𝓣𝓱𝓮 𝓜𝓪𝓻𝓿 mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -276.5 -638.9 80.3; setang -33.1 -38.7 0; echo ; echo ══ Peek 3/6: 3x deaths ══; echo Gegner: ⚜︎OCTAV!AN mit p90; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 649.0 666.0 119.4; setang 1.8 104.1 0; echo ; echo ══ Peek 4/6: 2x deaths ══; echo Gegner: notramin_ mit m4a1_silencer; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos -573.7 948.7 74.5; setang 0.4 7.3 0; echo ; echo ══ Peek 5/6: 2x deaths ══; echo Gegner: ⚜︎OCTAV!AN mit ak47; alias cs2c_peek cs2c_p6"
alias "cs2c_p6" "setpos 1118.3 -897.0 9.9; setang -3.8 60.3 0; echo ; echo ══ Peek 6/6: 2x deaths ══; echo Gegner: ThegodReker mit mp7; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/challenge_ancient"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " CHALLENGE: Ancient — 6 Bots"
echo " 60 Sekunden — Bots schiessen zurueck!"
echo " F2=Setup+Start  F5=Reset"
echo ""
echo " Schwierigkeit: cs2c_easy..cs2c_expert"
echo "══════════════════════════════════════"
echo ""
