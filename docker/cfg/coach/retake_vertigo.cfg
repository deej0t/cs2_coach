// =======================================================
// CS2 Coach — Vertigo RETAKE
// 3 Bots an gegnerischen Hold-Positionen
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (CT-Seite: verteidigen Positionen) ──
bot_kick
bot_quota 0
bot_difficulty 3
bot_dont_shoot 0

bot_add_ct
bot_add_ct
bot_add_ct

bot_stop 1

// ── Auto-Setup: 3 Hold-Positionen ──
alias "cs2c_ab1" "setpos -1452.6 468.8 11859.0; bot_place; echo [Bot 1/3] 2x — Sequence (m4a1_silencer); cs2c_ab2"
alias "cs2c_ab2" "setpos -1645.1 375.2 11776.0; bot_place; echo [Bot 2/3] 2x — PDK (m4a1_silencer); cs2c_ab3"
alias "cs2c_ab3" "setpos -1117.7 355.7 11776.0; bot_place; echo [Bot 3/3] 1x — Sequence (glock); cs2c_setup_done"
alias "cs2c_setup_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos -1174.0 482.4 11776.0; setang -16.6 -177.2 0; bind F2 cs2c_peek; bot_stop 0; bot_dont_shoot 0; echo ; echo ══════ SETUP FERTIG ══════; echo F2=Naechster Peek  F3=Bots toggle"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (deine Entry-Points) ──
alias "cs2c_p1" "setpos -1174.0 482.4 11776.0; setang -16.6 -177.2 0; echo ; echo ══ Peek 1/3: 2x deaths ══; echo Gegner: Sequence mit m4a1_silencer; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos -1024.0 333.6 11776.0; setang -0.0 176.2 0; echo ; echo ══ Peek 2/3: 2x deaths ══; echo Gegner: PDK mit m4a1_silencer; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos -1810.1 288.3 11776.0; setang -0.0 5.6 0; echo ; echo ══ Peek 3/3: 1x deaths ══; echo Gegner: Sequence mit glock; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Bot-Kontrolle ──
alias "cs2c_freeze" "bot_stop 1; bot_dont_shoot 1; echo Bots EINGEFROREN; alias cs2c_toggle cs2c_unfreeze"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo Bots AKTIV — viel Glueck!; alias cs2c_toggle cs2c_freeze"
alias "cs2c_toggle" "cs2c_unfreeze"

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/retake_vertigo"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F3" "cs2c_toggle"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " RETAKE: Vertigo — 3 Bots"
echo " Bots halten Positionen — retake!"
echo " F2=Setup  F3=Toggle  F4=Noclip  F5=Reset"
echo "══════════════════════════════════════"
echo ""
