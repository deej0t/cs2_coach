// =======================================================
// CS2 Coach — Inferno SPRAY-TRANSFER
// 5 Bots in Reihe — Spray-Kontrolle ueben
// =======================================================

// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (eingefroren in Reihe) ──
bot_kick
bot_quota 0
bot_difficulty 0
bot_dont_shoot 1

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 5 Bots in Reihe ──
alias "cs2c_ab1" "setpos 1329.8 266.8 122.3; bot_place; echo [Bot 1/5]; cs2c_ab2"
alias "cs2c_ab2" "setpos 1340.6 376.3 122.3; bot_place; echo [Bot 2/5]; cs2c_ab3"
alias "cs2c_ab3" "setpos 1351.3 485.7 122.3; bot_place; echo [Bot 3/5]; cs2c_ab4"
alias "cs2c_ab4" "setpos 1362.1 595.2 122.3; bot_place; echo [Bot 4/5]; cs2c_ab5"
alias "cs2c_ab5" "setpos 1372.9 704.7 122.3; bot_place; echo [Bot 5/5]; cs2c_spray_done"
alias "cs2c_spray_done" "noclip; bot_stop 1; bot_dont_shoot 1; setpos 309.3 588.2 94.0; setang -1.5 -5.6 0; echo ; echo ══════ SPRAY DRILL BEREIT ══════; echo Ziel auf den linken Bot — Spray nach rechts transferieren"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Zurueck zur Schussposition ──
alias "cs2c_origin" "setpos 309.3 588.2 94.0; setang -1.5 -5.6 0; echo Zurueck zur Startposition"

alias "cs2c_reset" "exec coach/spray_inferno"

// ── Keybinds ──
bind "F2" "cs2c_setup"   // Auto-Setup
bind "F3" "cs2c_origin"  // Zurueck zur Startposition
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " SPRAY-TRANSFER: Inferno"
echo " 5 Bots in Reihe"
echo " F2=Setup  F3=Startposition  F5=Reset"
echo ""
echo " Tipp: Links anfangen, nach rechts"
echo " transferieren. Burst-Kontrolle!"
echo "══════════════════════════════════════"
echo ""
