// =======================================================
// CS2 Coach — Cache CHALLENGE (Speed-Run)
// 6 Bots — 55 Sekunden — schaff sie alle!
// =======================================================

// ── Server Setup (kurzer Timer!) ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 55
mp_roundtime_defuse 55
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 0.8
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_solid_teammates 0
sv_talk_enemy_dead 1
sv_talk_enemy_living 1
sv_deadtalk 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock

// ── Bots (aktiv, Expert) ──
bot_kick
bot_quota 0
bot_difficulty 2
bot_dont_shoot 0

bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

bot_stop 1

// ── Auto-Setup: 6 Spots + UNFREEZE ──
alias "cs2c_ab1" "setpos 1016.9 204.0 1612.0; bot_place; echo [Bot 1/6]; cs2c_ab2"
alias "cs2c_ab2" "setpos -100.2 529.2 1649.0; bot_place; echo [Bot 2/6]; cs2c_ab3"
alias "cs2c_ab3" "setpos 293.2 -760.5 1610.8; bot_place; echo [Bot 3/6]; cs2c_ab4"
alias "cs2c_ab4" "setpos 717.9 760.9 1700.0; bot_place; echo [Bot 4/6]; cs2c_ab5"
alias "cs2c_ab5" "setpos 7.5 -1246.9 1660.0; bot_place; echo [Bot 5/6]; cs2c_ab6"
alias "cs2c_ab6" "setpos 741.3 1588.7 1700.0; bot_place; echo [Bot 6/6]; cs2c_challenge_go"
alias "cs2c_challenge_go" "noclip; setpos -375.3 142.2 1649.1; setang 1.5 2.5 0; bot_stop 0; bot_dont_shoot 0; mp_restartgame 1; echo ; echo ══════ CHALLENGE START ══════; echo 6 Bots — 55 Sekunden — GO GO GO!; bind F2 cs2c_peek"
alias "cs2c_setup" "noclip; cs2c_ab1"

// ── Peek-Positionen (Hilfe) ──
alias "cs2c_p1" "setpos -375.3 142.2 1649.1; setang 1.5 2.5 0; echo ; echo ══ Peek 1/6: 7x deaths ══; echo Gegner: ☯    95    ☯ mit ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 257.2 371.0 1642.0; setang -1.0 156.1 0; echo ; echo ══ Peek 2/6: 6x deaths ══; echo Gegner: Avin mit ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 153.5 -812.2 1638.6; setang 10.6 20.3 0; echo ; echo ══ Peek 3/6: 5x deaths ══; echo Gegner: hai vai mit m4a1_silencer; alias cs2c_peek cs2c_p4"
alias "cs2c_p4" "setpos 1368.6 670.8 1627.6; setang -6.3 172.1 0; echo ; echo ══ Peek 4/6: 5x deaths ══; echo Gegner: BiMSHA mit famas; alias cs2c_peek cs2c_p5"
alias "cs2c_p5" "setpos -403.5 -598.4 1759.2; setang 7.4 -57.6 0; echo ; echo ══ Peek 5/6: 5x deaths ══; echo Gegner: CORN mit ak47; alias cs2c_peek cs2c_p6"
alias "cs2c_p6" "setpos 437.0 1238.2 1695.1; setang -0.6 49.0 0; echo ; echo ══ Peek 6/6: 4x deaths ══; echo Gegner: Avin mit mp7; alias cs2c_peek cs2c_p1"
alias cs2c_peek cs2c_p1

// ── Schwierigkeit ──
alias "cs2c_easy" "bot_difficulty 0; echo Schwierigkeit: LEICHT"
alias "cs2c_medium" "bot_difficulty 1; echo Schwierigkeit: MITTEL"
alias "cs2c_hard" "bot_difficulty 2; echo Schwierigkeit: SCHWER"
alias "cs2c_expert" "bot_difficulty 3; echo Schwierigkeit: EXPERTE"

alias "cs2c_reset" "exec coach/challenge_cache"

// ── Keybinds ──
bind "F2" "cs2c_setup"
bind "F4" "noclip"
bind "F5" "cs2c_reset"

mp_restartgame 1

echo ""
echo "══════════════════════════════════════"
echo " CHALLENGE: Cache — 6 Bots"
echo " 55 Sekunden — Bots schiessen zurueck!"
echo " F2=Setup+Start  F5=Reset"
echo ""
echo " Schwierigkeit: cs2c_easy..cs2c_expert"
echo "══════════════════════════════════════"
echo ""
