// ── Server Setup ──
sv_cheats 1
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_maxmoney 65535
mp_startmoney 65535
mp_free_armor 1
mp_death_drop_gun 0
sv_infinite_ammo 1
ammo_grenade_limit_total 5
sv_showimpacts 1
sv_showimpacts_time 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1

// ── Clean Slate ──
bot_kick
mp_autoteambalance 0
mp_limitteams 0

// ── Phase 1: Bot-Placement (10 Spots) ──
// F2 = Naechster Spot (teleportiert zum Gegner-Spot)
// F3 = Bot platzieren + weiter
// F4 = Fertig → Practice starten
// F5 = Noclip an/aus
// F6 = Reset (alle Bots kicken, neu starten)

alias "cs2c_s1" "setpos 2012.4 268.5 160.0; bot_add_t; echo ; echo === Spot 1/10: 3x deaths ===; echo Gegner: СЯВКА (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s2"
alias "cs2c_s2" "setpos 1256.4 2780.1 124.0; bot_add_t; echo ; echo === Spot 2/10: 2x deaths ===; echo Gegner: СЯВКА (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s3"
