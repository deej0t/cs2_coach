alias "cs2c_p6" "setpos 545.1 2455.2 279.0; setang 7.4 95.0 0; echo ; echo === Peek 6/10 ===; echo Du stirbst hier 1x - peeke Richtung Bsmil3; echo Waffe: usp_silencer; alias cs2c_peek cs2c_p7"
alias "cs2c_p7" "setpos 725.1 2122.8 136.0; setang 0.1 77.3 0; echo ; echo === Peek 7/10 ===; echo Du stirbst hier 1x - peeke Richtung Joker!!!; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p8"
alias "cs2c_p8" "setpos 923.7 -30.9 258.9; setang 0.9 -68.7 0; echo ; echo === Peek 8/10 ===; echo Du stirbst hier 1x - peeke Richtung ЖОЗЭ СИЛЬВА; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p9"
alias "cs2c_p9" "setpos 1223.9 -529.8 179.7; setang -23.2 79.2 0; echo ; echo === Peek 9/10 ===; echo Du stirbst hier 1x - peeke Richtung ЖОЗЭ СИЛЬВА; echo Waffe: cz75a; alias cs2c_peek cs2c_p10"
alias "cs2c_p10" "setpos 258.5 1861.9 129.7; setang -1.1 5.1 0; echo ; echo === Peek 10/10 ===; echo Du stirbst hier 1x - peeke Richtung Bsmil3; echo Waffe: mp9; alias cs2c_peek cs2c_p1"

alias "cs2c_start" "bot_stop 1; mp_respawn_on_death_t 0; noclip; echo ; echo ======================================; echo  PRACTICE MODUS AKTIV; echo  Bots eingefroren - uebe deine Peeks!; echo  F2 = Naechste Peek-Position; echo  F6 = Reset; echo ======================================; echo ; bind F2 cs2c_peek; bind F4 cs2c_unfreeze; cs2c_p1"
alias "cs2c_unfreeze" "bot_stop 0; bot_dont_shoot 0; echo ; echo Bots AKTIV - viel Glueck!; echo F6 zum Reset"
alias "cs2c_reset" "bot_kick; mp_respawn_on_death_t 1; alias cs2c_next cs2c_s1; alias cs2c_peek cs2c_p1; bind F2 cs2c_next; bind F4 cs2c_start; noclip; echo ; echo Reset - druecke F2 fuer Spot 1"

alias cs2c_next cs2c_s1
alias cs2c_peek cs2c_p1

// ── Keybinds ──
bind "F2" "cs2c_next"
bind "F3" "cs2c_place"
bind "F4" "cs2c_start"
bind "F5" "noclip"
bind "F6" "cs2c_reset"

// ── Start: Noclip an, druecke F2 fuer Spot 1 ──
noclip

