alias "cs2c_s8" "setpos 990.2 -201.4 256.0; bot_add_t; echo ; echo === Spot 8/10: 1x deaths ===; echo Gegner: ЖОЗЭ СИЛЬВА (m4a1_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s9"
alias "cs2c_s9" "setpos 1259.1 -346.0 260.0; bot_add_t; echo ; echo === Spot 9/10: 1x deaths ===; echo Gegner: ЖОЗЭ СИЛЬВА (cz75a); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s10"
alias "cs2c_s10" "setpos 587.5 1891.1 136.0; bot_add_t; echo ; echo === Spot 10/10: 1x deaths ===; echo Gegner: Bsmil3 (mp9); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_setup_done"
alias "cs2c_setup_done" "echo ; echo Alle Spots besucht!; echo Druecke F4 um Practice zu starten.; alias cs2c_next cs2c_setup_done"
alias "cs2c_place" "bot_place; cs2c_next"

// ── Phase 2: Practice (Peek-Positionen) ──
alias "cs2c_p1" "setpos 2317.0 784.4 196.8; setang 3.5 -120.6 0; echo ; echo === Peek 1/10 ===; echo Du stirbst hier 3x - peeke Richtung СЯВКА; echo Waffe: ak47; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 267.8 2617.4 162.5; setang 2.2 9.3 0; echo ; echo === Peek 2/10 ===; echo Du stirbst hier 2x - peeke Richtung СЯВКА; echo Waffe: ak47; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 352.6 2482.7 164.2; setang 0.2 37.5 0; echo ; echo === Peek 3/10 ===; echo Du stirbst hier 2x - peeke Richtung sashich; echo Waffe: ak47; alias cs2c_peek cs2c_p4"
