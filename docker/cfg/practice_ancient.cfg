// F3 = Bot platzieren + weiter
// F4 = Fertig → Practice starten
// F5 = Noclip an/aus
// F6 = Reset (alle Bots kicken, neu starten)

alias "cs2c_s1" "setpos 142.5 -832.3 153.0; bot_add_t; echo ; echo === Spot 1/10: 2x deaths ===; echo Gegner: rpz2 (galilar); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s2"
