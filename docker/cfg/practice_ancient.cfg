alias "cs2c_s8" "setpos 1170.4 896.5 110.6; bot_add_t; echo ; echo === Spot 8/10: 1x deaths ===; echo Gegner: gHìci™ (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s9"
alias "cs2c_s9" "setpos -623.8 874.5 103.6; bot_add_t; echo ; echo === Spot 9/10: 1x deaths ===; echo Gegner: Viper (ak47); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_s10"
alias "cs2c_s10" "setpos -441.8 1272.0 35.3; bot_add_t; echo ; echo === Spot 10/10: 1x deaths ===; echo Gegner: rpz2 (usp_silencer); echo Schau auf den Boden und druecke F3; alias cs2c_next cs2c_setup_done"
alias "cs2c_setup_done" "echo ; echo Alle Spots besucht!; echo Druecke F4 um Practice zu starten.; alias cs2c_next cs2c_setup_done"
alias "cs2c_place" "bot_place; cs2c_next"

// ── Phase 2: Practice (Peek-Positionen) ──
alias "cs2c_p1" "setpos 345.1 -525.0 171.1; setang 2.8 -123.4 0; echo ; echo === Peek 1/10 ===; echo Du stirbst hier 2x - peeke Richtung rpz2; echo Waffe: galilar; alias cs2c_peek cs2c_p2"
alias "cs2c_p2" "setpos 509.9 -508.0 182.1; setang 1.6 -173.2 0; echo ; echo === Peek 2/10 ===; echo Du stirbst hier 2x - peeke Richtung #ZzZzZeus; echo Waffe: tec9; alias cs2c_peek cs2c_p3"
alias "cs2c_p3" "setpos 881.0 819.8 117.1; setang 2.4 -179.6 0; echo ; echo === Peek 3/10 ===; echo Du stirbst hier 2x - peeke Richtung Viper; echo Waffe: m4a1_silencer; alias cs2c_peek cs2c_p4"
