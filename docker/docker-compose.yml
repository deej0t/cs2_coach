# CS2 Coach — Docker Compose fuer Unraid
#
# Services:
#   cs2-coach   — Web-UI fuer Demo-Analyse, KI-Coaching, Practice-Config-Generator
#   cs2-practice — CS2 Dedicated Server mit Practice-Configs (optional)
#
# Setup:
#   1. docker-compose up -d cs2-coach         (nur Web-UI)
#   2. docker-compose up -d                    (Web-UI + CS2 Server)
#   3. Oeffne http://<UNRAID-IP>:5000
#
# Unraid Community Apps:
#   Alternativ als einzelner Container ueber Unraid Docker UI installierbar.
#   Template: siehe docker/unraid-template.xml

services:
  # ── CS2 Coach Web-UI ──
  cs2-coach:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cs2-coach:latest
    container_name: cs2-coach
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - CS2COACH_CONFIG=/data/config.yaml
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      # Persistent data — config, demos, vault exports
      - cs2-coach-data:/data
      # Practice configs — shared with CS2 server
      - cs2-coach-cfg:/data/cfg
      # Optional: direkt auf Unraid-Share zugreifen
      # - /mnt/user/appdata/cs2-coach/demos:/data/demos
      # - /mnt/user/appdata/cs2-coach/vault:/data/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── CS2 Practice Server (optional) ──
  cs2-practice:
    image: joedwards32/cs2:latest
    container_name: cs2-practice
    restart: unless-stopped
    depends_on:
      cs2-coach:
        condition: service_healthy
    ports:
      - "27015:27015/tcp"   # Game server
      - "27015:27015/udp"   # Game server (UDP)
      - "27020:27020/tcp"   # RCON
    environment:
      # ── Server Identity ──
      CS2_SERVERNAME: "CS2 Coach Practice Server"
      CS2_PORT: 27015
      CS2_RCON_PORT: 27020
      CS2_RCONPW: "coach2024"
      CS2_PW: ""

      # ── Game Settings ──
      CS2_GAMETYPE: 0        # Classic
      CS2_GAMEMODE: 1        # Casual (no competitive cooldowns)
      CS2_MAPGROUP: "mg_active"
      CS2_STARTMAP: "de_mirage"
      CS2_MAXPLAYERS: 12
      CS2_LAN: 1             # LAN only

      # ── Bot Settings ──
      CS2_BOT_QUOTA: 5
      CS2_BOT_DIFFICULTY: 3

      # ── Auto-Update ──
      STEAMUSER: ""
      STEAMPASS: ""
      CS2_ADDITIONAL_ARGS: "+sv_lan 1"

    volumes:
      # Practice configs from cs2-coach (shared volume)
      - cs2-coach-cfg:/home/steam/cs2-dedicated/game/csgo/cfg/coach:ro
      # Persistent server data
      - cs2-server-data:/home/steam/cs2-dedicated

    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  cs2-coach-data:
    driver: local
  cs2-coach-cfg:
    driver: local
  cs2-server-data:
    driver: local
