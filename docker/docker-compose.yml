# CS2 Coach — Docker Compose fuer Unraid
#
# Service:
#   cs2-coach — Web-UI fuer Demo-Analyse, KI-Coaching, Practice-Config-Generator
#
# Die Practice-Configs laufen im eigenen CS2-Client (siehe docker/README.md).
# Einen Dedicated Server gibt es hier bewusst nicht mehr.
#
# Setup:
#   1. docker-compose up -d
#   2. Oeffne http://<UNRAID-IP>:5000
#
# Unraid Community Apps:
#   Alternativ als einzelner Container ueber Unraid Docker UI installierbar.
#   Template: siehe docker/unraid-template.xml

services:
  # ── CS2 Coach Web-UI ──
  cs2-coach:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cs2-coach:latest
    container_name: cs2-coach
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - CS2COACH_CONFIG=/data/config.yaml
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      # Persistent data — config, vault exports
      - cs2-coach-data:/data
      # Generierte Practice-Configs
      - cs2-coach-cfg:/data/cfg
      # Demos getrennt halten: eine Demo ist 40-330 MB, 60 Matches belegen
      # rund 14 GB. Auf Unraid gehoert das auf einen Array-Share und nicht
      # unter appdata, das ueblicherweise Cache-only ist.
      - ${DEMO_PATH:-cs2-coach-demos}:/data/demos
      # Optional: Vault direkt auf einen Unraid-Share legen
      # - /mnt/user/appdata/cs2-coach/vault:/data/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  cs2-coach-data:
    driver: local
  cs2-coach-cfg:
    driver: local
  # Nur Rueckfall, wenn DEMO_PATH nicht gesetzt ist. Auf Unraid stattdessen
  # DEMO_PATH=/mnt/user/cs2-demos setzen.
  cs2-coach-demos:
    driver: local
