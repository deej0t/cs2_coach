# CS2 Coach — Practice Server for Unraid
#
# Setup:
#   1. Copy this file to your Unraid server
#   2. Set STEAMUSER/STEAMPASS if you want auto-updates (optional)
#   3. docker-compose up -d
#   4. Connect in CS2: connect <UNRAID-IP>:27015
#
# Volume Mapping:
#   ./cfg/ is mounted into the CS2 server config directory.
#   The cs2-coach app generates practice configs into this folder.

services:
  cs2-practice:
    image: joedwards32/cs2:latest
    container_name: cs2-practice
    restart: unless-stopped
    ports:
      - "27015:27015/tcp"   # Game server
      - "27015:27015/udp"   # Game server (UDP)
      - "27020:27020/tcp"   # RCON
    environment:
      # ── Server Identity ──
      CS2_SERVERNAME: "CS2 Coach Practice Server"
      CS2_PORT: 27015
      CS2_RCON_PORT: 27020
      CS2_RCONPW: "coach2024"
      CS2_PW: ""

      # ── Game Settings ──
      CS2_GAMETYPE: 0        # Classic
      CS2_GAMEMODE: 1        # Casual (no competitive cooldowns)
      CS2_MAPGROUP: "mg_active"
      CS2_STARTMAP: "de_mirage"
      CS2_MAXPLAYERS: 12
      CS2_LAN: 1             # LAN only (no VAC, no Steam login needed)

      # ── Bot Settings ──
      CS2_BOT_QUOTA: 5
      CS2_BOT_DIFFICULTY: 3  # 0=easy, 1=normal, 2=hard, 3=expert

      # ── Auto-Update ──
      STEAMUSER: ""          # Leave empty for anonymous (works for CS2)
      STEAMPASS: ""
      CS2_ADDITIONAL_ARGS: "+sv_lan 1"

    volumes:
      # Custom configs generated by cs2-coach
      - ./cfg:/home/steam/cs2-dedicated/game/csgo/cfg/coach:ro
      # Persistent server data
      - cs2-data:/home/steam/cs2-dedicated

    # Resource limits for Unraid
    # NOTE: SteamCMD braucht ~6-8 GB RAM beim Verifizieren von 71 GB.
    # Bei zu wenig RAM wird der Prozess gekillt und der Download
    # startet in einer Endlosschleife neu.
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  cs2-data:
    driver: local
