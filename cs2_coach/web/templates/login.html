<!DOCTYPE html>
<html lang="{{ lang|default('de') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>CS2 Coach — Login</title>
    <style>
        :root {
            --color-bg: #161826;
            --color-surface: #232532;
            --color-text: #e9e9ed;
            --color-accent: #9184d9;
            --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
            --color-neutral-400: #b2b6ca;
            --color-neutral-500: #9397ab;
            --color-neutral-700: #595d6c;
            --color-red: #f87171;
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 14px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--color-bg); color: var(--color-text);
            font-family: "Inter", system-ui, sans-serif;
            padding: 20px;
        }
        .login-card {
            width: 100%; max-width: 340px;
            background: var(--color-surface);
            border: 1px solid var(--color-divider);
            border-radius: var(--radius-lg);
            padding: 28px 26px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .brand-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--color-accent);
        }
        .subtitle {
            font-size: 12px; color: var(--color-neutral-500);
            margin-bottom: 20px;
        }
        label {
            display: block; font-size: 12px; font-weight: 600;
            color: var(--color-neutral-400); margin-bottom: 6px;
        }
        input[type=password] {
            width: 100%; padding: 9px 11px; font-size: 14px;
            font-family: inherit;
            color: var(--color-text);
            background: var(--color-bg);
            border: 1px solid var(--color-neutral-700);
            border-radius: var(--radius-sm);
            outline: none; transition: border-color 0.15s;
        }
        input[type=password]:focus { border-color: var(--color-accent); }
        button {
            width: 100%; margin-top: 14px; padding: 9px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            color: #fff; background: var(--color-accent);
            border: none; border-radius: var(--radius-sm);
            cursor: pointer; transition: filter 0.15s;
        }
        button:hover { filter: brightness(1.1); }
        .alert {
            margin-bottom: 14px; padding: 8px 11px;
            font-size: 12px; border-radius: var(--radius-sm);
            background: color-mix(in srgb, var(--color-red) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--color-red) 40%, transparent);
            color: var(--color-red);
        }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="{{ url_for('login') }}">
        <div class="brand"><span class="brand-dot"></span> CS2 Coach</div>
        <div class="subtitle">{{ _('Bitte Passwort eingeben') }}</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                <div class="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <label for="password">{{ _('Passwort') }}</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
        <input type="hidden" name="next" value="{{ next_url }}">
        <button type="submit">{{ _('Anmelden') }}</button>
    </form>
</body>
</html>
