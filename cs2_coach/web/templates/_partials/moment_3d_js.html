<script type="module">
// 3D-Ansicht der Schluesselmomente: Kollisionsgeometrie der Map (map3d.py) plus
// Spieler aus der Demo. Kamera aus deinen Augen, aus denen des Gegners oder frei.
// Koordinaten = Spieleinheiten, Z oben - wie in der Demo, keine Umrechnung.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const COLORS = { self: 0x4ade80, mate: 0x60a5fa, enemy: 0xf87171, unknown: 0x9ca3af };
const VFOV = 73.7;           // vertikal zu 106° horizontal bei 16:9 (CS2-Standard)
const EYE = 64, EYE_DUCK = 46;
const geoCache = {};

let nades = null;
let renderer, scene, camera, world, playersGroup, overlay, mode = 'me', data = null, viewModel = null;

function canvasEl() { return document.getElementById('km-3d'); }

function init() {
    if (renderer) return;
    const cv = canvasEl();
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fb4c7);
    scene.fog = new THREE.Fog(0x9fb4c7, 1500, 6000);
    camera = new THREE.PerspectiveCamera(VFOV, 16 / 9, 1, 20000);
    camera.up.set(0, 0, 1);
    scene.add(camera);   // die Ego-Waffe haengt an der Kamera
    const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5b45, 1.6);
    hemi.position.set(0, 0, 1);   // Himmel oben = +Z (Spielkoordinaten)
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(0.4, 0.3, 1);
    scene.add(sun);
    playersGroup = new THREE.Group();
    scene.add(playersGroup);
    overlay = new THREE.Group();
    scene.add(overlay);
    if (window.kmModels) viewModel = new window.kmModels.ViewModel(camera);
    if (window.kmNades) nades = window.kmNades.create(scene);
    flyInit(cv);
    resize();
    window.addEventListener('resize', resize);
}

function resize() {
    // Groesse kommt aus dem CSS (Spaltenbreite, Vollbild) - die Zeichenflaeche folgt ihr
    if (!renderer) return;
    const cv = canvasEl();
    const w = cv.clientWidth || 960, h = cv.clientHeight || Math.round(w * 9 / 16);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
}

async function loadRender(mapKey, parts) {
    // Texturierte Map (map3d_render.py): schon in Spieleinheiten, Z oben - keine Umrechnung.
    // Grosse Maps liegen in mehreren Teilen (Groessengrenze des Tunnels), alle parallel laden.
    const base = '{{ url_for("moments_page.render", map_key="MAPKEY") }}'.replace('MAPKEY', mapKey);
    const done = new Array(parts).fill(0);
    const msg = document.getElementById('km-3d-msg');
    const loader = new GLTFLoader();
    const all = await Promise.all(Array.from({ length: parts }, (_, i) =>
        loader.loadAsync(base + '?part=' + i, ev => {
            done[i] = ev.loaded;
            if (msg && (!msg.textContent || msg.textContent.startsWith('Texturen'))) msg.textContent = 'Texturen werden geladen... ' + Math.round(done.reduce((a, b) => a + b, 0) / 1048576) + ' MB';
        })));
    const g = new THREE.Group();
    all.forEach(gltf => {
        gltf.scene.traverse(o => {
            if (o.isMesh && o.material) {
                o.material.side = o.material.alphaTest || o.material.transparent ? THREE.DoubleSide : o.material.side;
                o.material.roughness = 1; o.material.metalness = 0;
            }
        });
        g.add(gltf.scene);
    });
    return g;
}

// Texturierte Map: einmal je Map laden (auch vorab, waehrend die Szene noch gerechnet wird)
const renderCache = {}, renderReady = {};
function renderPromise(mapKey, parts) {
    if (!renderCache[mapKey]) {
        renderCache[mapKey] = loadRender(mapKey, Number(parts)).then(g => {
            renderReady[mapKey] = g;
            const msg = document.getElementById('km-3d-msg');
            if (msg && msg.textContent.startsWith('Texturen')) msg.textContent = '';
            return g;
        }).catch(e => { console.warn('texturierte Map nicht ladbar, bleibt beim Kollisionsmodell', e); return null; });
    }
    return renderCache[mapKey];
}

function setWorld(g) {
    if (!g || world === g) return;
    if (world) scene.remove(world);
    world = g; scene.add(g);
}

async function loadGeo(mapKey) {
    // schlichtes Kollisionsmodell (1-16 MB) - sofort sichtbar, bis die Texturen da sind
    if (geoCache[mapKey]) return geoCache[mapKey];
    const r = await fetch('{{ url_for("moments_page.geo", map_key="MAPKEY") }}'.replace('MAPKEY', mapKey));
    if (!r.ok) throw new Error('Für diese Map gibt es noch keine 3D-Geometrie');
    const buf = await r.arrayBuffer();
    const [nv, ns, nt] = new Uint32Array(buf, 0, 3);
    const pos = new Float32Array(buf, 12, nv * 3);
    const idx = new Uint32Array(buf, 12 + nv * 12, ns + nt);
    const g = new THREE.Group();
    const mk = (from, count, mat) => {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setIndex(new THREE.BufferAttribute(idx.subarray(from, from + count), 1));
        g.add(new THREE.Mesh(geo, mat));
    };
    mk(0, ns, new THREE.MeshStandardMaterial({ color: 0xc9b99a, flatShading: true, roughness: 0.95, side: THREE.DoubleSide }));
    if (nt) mk(ns, nt, new THREE.MeshStandardMaterial({ color: 0x8899aa, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false }));
    geoCache[mapKey] = g;
    return g;
}

function dirFrom(yaw, pitch) {
    // Source: yaw gegen den Uhrzeigersinn ab +X, pitch positiv = nach unten
    const y = yaw * Math.PI / 180, p = pitch * Math.PI / 180;
    return new THREE.Vector3(Math.cos(p) * Math.cos(y), Math.cos(p) * Math.sin(y), -Math.sin(p));
}

function label(text, color) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const x = c.getContext('2d');
    x.font = 'bold 30px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = 6; x.strokeStyle = 'rgba(0,0,0,0.85)'; x.strokeText(text, 128, 32);
    x.fillStyle = '#' + color.toString(16).padStart(6, '0'); x.fillText(text, 128, 32);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    s.scale.set(80, 20, 1);
    return s;
}

function playerMesh(team, isFocus) {
    const g = new THREE.Group();
    const color = COLORS[team] || COLORS.unknown;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(14, 44, 4, 8),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35 }));
    body.rotation.x = Math.PI / 2;
    body.position.z = 36;
    g.add(body);
    g.userData.body = body;
    if (isFocus) {
        // Ring am Boden: die beiden Duellanten sind sofort zu finden
        const ring = new THREE.Mesh(new THREE.RingGeometry(26, 34, 32),
            new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, depthTest: false, transparent: true, opacity: 0.9 }));
        ring.position.z = 2;
        g.add(ring);
    }
    return g;
}

// ── Wiedergabe ───────────────────────────────────────────────────────────
// Figuren werden einmal je Moment gebaut und danach nur bewegt. Gezeichnet
// wird mit der Bildrate des Bildschirms; die Positionen liegen mit 32 Hz vor
// und werden dazwischen linear interpoliert (Winkel ueber den kuerzeren Weg).
let figures = {}, ticks3d = [], loopOn = false, camFreeSet = false;
const _eye = new THREE.Vector3(), _end = new THREE.Vector3();

function buildFigures() {
    playersGroup.clear(); overlay.clear(); figures = {};
    const mo = data.moment;
    data.players.forEach((pl, i) => {
        const focus = i === mo.me_idx || i === mo.killer_idx;
        const color = COLORS[pl.team] || COLORS.unknown;
        const g = playerMesh(pl.team, focus);
        const lb = label(pl.name.slice(0, 12), color);
        lb.position.z = 92;
        g.add(lb);
        let ray = null;
        if (focus) {
            ray = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
                                 new THREE.LineBasicMaterial({ color }));
            ray.frustumCulled = false;
            overlay.add(ray);
        }
        g.visible = false;
        playersGroup.add(g);
        figures[i] = { g, ray, model: null };
    });
    if (nades) nades.build(data.nades);
    ticks3d = Object.keys(data.view3d).map(Number).sort((a, b) => a - b);
    // Je Tick: Spieler-Index -> Zeile, fuer schnelles Nachschlagen
    data.byTick = {};
    ticks3d.forEach(t => { const m = {}; data.view3d[t].forEach(r => { m[r[0]] = r; }); data.byTick[t] = m; });
    camFreeSet = false;
}

async function buildModels() {
    // Agentenmodelle statt Kapseln, sobald models3d exportiert ist; sonst bleiben die Kapseln
    if (!window.kmModels || !(await window.kmModels.prepare(data))) return;
    const sideOf = {};
    ticks3d.forEach(t => data.view3d[t].forEach(r => { if (!sideOf[r[0]] && (r[8] === 2 || r[8] === 3)) sideOf[r[0]] = r[8]; }));
    const jobs = [];
    for (const key in figures) {
        const side = sideOf[key];
        if (!side) continue;
        const m = new window.kmModels.Figure(side);
        if (!m.ready) continue;
        m.root.visible = false;
        playersGroup.add(m.root);
        figures[key].model = m;
        jobs.push(m.ready);
    }
    await Promise.all(jobs);
}

function lastShotKick(t) {
    // Rueckstoss der Ego-Waffe: kurz nach jedem eigenen Schuss (aim_trace)
    const shots = (data.aim && data.aim.shots) || [];
    let k = 0;
    for (const s of shots) { const d = t - s.tick; if (d >= 0 && d < 8) k = Math.max(k, 1 - d / 8); }
    return k;
}

function lerpAngle(a, b, f) { const d = ((b - a + 540) % 360) - 180; return a + d * f; }

function currentTick() {
    // der Player (moment_theater) fuehrt die Zeit tickgenau
    const t = window.km && window.km.tick;
    return t || ticks3d[0];
}

// ── Freie Kamera: fliegen mit WASD, umsehen mit gezogener Maus ───────────
const fly = { yaw: 45, pitch: 35, keys: {}, speed: 450, drag: false, lx: 0, ly: 0, last: 0 };
const FLY_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight'];
function flyInit(cv) {
    cv.addEventListener('mousedown', e => { if (mode !== 'free') return; fly.drag = true; fly.lx = e.clientX; fly.ly = e.clientY; e.preventDefault(); });
    window.addEventListener('mouseup', () => { fly.drag = false; });
    window.addEventListener('mousemove', e => {
        if (!fly.drag) return;
        fly.yaw -= (e.clientX - fly.lx) * 0.2;
        fly.pitch = Math.max(-89, Math.min(89, fly.pitch + (e.clientY - fly.ly) * 0.2));
        fly.lx = e.clientX; fly.ly = e.clientY;
    });
    cv.addEventListener('contextmenu', e => { if (mode === 'free') e.preventDefault(); });
    cv.addEventListener('wheel', e => {
        if (mode !== 'free') return;
        fly.speed = Math.max(50, Math.min(3000, fly.speed * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
        flash('Tempo ' + Math.round(fly.speed) + ' u/s');
        e.preventDefault();
    }, { passive: false });
    document.addEventListener('keydown', e => {
        if (mode !== 'free' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
        if (e.code === 'KeyC') { camFreeSet = false; e.preventDefault(); return; }
        if (FLY_KEYS.includes(e.code)) { fly.keys[e.code] = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', e => { delete fly.keys[e.code]; });
    window.addEventListener('blur', () => { fly.keys = {}; });
}
let flashTimer = null;
function flash(text) {
    const msg = document.getElementById('km-3d-msg');
    msg.textContent = text;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { if (msg.textContent === text) msg.textContent = ''; }, 900);
}
function flyStep() {
    const now = performance.now(), dt = Math.min((now - (fly.last || now)) / 1000, 0.1);
    fly.last = now;
    const k = fly.keys, fwd = dirFrom(fly.yaw, fly.pitch);
    const right = new THREE.Vector3(Math.sin(fly.yaw * Math.PI / 180), -Math.cos(fly.yaw * Math.PI / 180), 0);
    const mv = new THREE.Vector3();
    if (k.KeyW) mv.add(fwd);
    if (k.KeyS) mv.sub(fwd);
    if (k.KeyD) mv.add(right);
    if (k.KeyA) mv.sub(right);
    if (k.KeyE) mv.z += 1;
    if (k.KeyQ) mv.z -= 1;
    if (mv.lengthSq() > 0) {
        const sp = fly.speed * (k.ShiftLeft || k.ShiftRight ? 3 : 1) * (k.ControlLeft || k.ControlRight ? 0.3 : 1);
        camera.position.addScaledVector(mv.normalize(), sp * dt);
    }
    camera.lookAt(camera.position.clone().add(fwd));
}

function sample(t) {
    // die zwei umgebenden 32-Hz-Stuetzstellen und der Anteil dazwischen
    let lo = 0, hi = ticks3d.length - 1;
    if (t <= ticks3d[0]) return [data.byTick[ticks3d[0]], data.byTick[ticks3d[0]], 0];
    if (t >= ticks3d[hi]) return [data.byTick[ticks3d[hi]], data.byTick[ticks3d[hi]], 0];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ticks3d[m] <= t) lo = m; else hi = m; }
    return [data.byTick[ticks3d[lo]], data.byTick[ticks3d[hi]], (t - ticks3d[lo]) / (ticks3d[hi] - ticks3d[lo])];
}

function pose(a, b, f) {
    if (!a) return null;
    if (!b) b = a;
    return { x: a[1] + (b[1] - a[1]) * f, y: a[2] + (b[2] - a[2]) * f, z: a[3] + (b[3] - a[3]) * f,
             yaw: lerpAngle(a[4], b[4], f), pitch: a[5] + (b[5] - a[5]) * f,
             hp: f < 0.5 ? a[6] : b[6], duck: f < 0.5 ? a[7] : b[7],
             side: a[8], wkey: (f < 0.5 ? a : b)[9] || '', wname: (f < 0.5 ? a : b)[10] || '',
             ammo: (f < 0.5 ? a : b)[11], armor: (f < 0.5 ? a : b)[12], flashed: !!(f < 0.5 ? a : b)[13],
             scoped: !!(f < 0.5 ? a : b)[14],
             // Geschwindigkeit in Einheiten/s aus den beiden Stuetzstellen (2 Ticks Abstand)
             vel: [(b[1] - a[1]) * 32, (b[2] - a[2]) * 32] };
}

function draw() {
    if (!renderer || !data || !data.byTick || !window.km.data || !ticks3d.length) return;
    const mo = data.moment;
    const tNow = currentTick();
    if (nades) nades.update(tNow);
    const [A, B, f] = sample(tNow);
    const viewer = mode === 'me' ? mo.me_idx : (mode === 'enemy' ? mo.killer_idx : null);
    let view = null;
    for (const key in figures) {
        const i = Number(key), p = pose(A[i], B[i], f), fig = figures[i];
        if (!p || p.hp <= 0) { fig.g.visible = false; if (fig.ray) fig.ray.visible = false;
                                if (fig.model) fig.model.root.visible = false; continue; }
        fig.g.visible = i !== viewer;   // eigene Figur ausblenden, die Kamera steht darin
        fig.g.position.set(p.x, p.y, p.z);
        const real = fig.model && fig.model.ok;
        fig.g.userData.body.visible = !real;
        fig.g.userData.body.scale.y = p.duck ? 0.72 : 1;
        if (real) {
            fig.model.root.visible = i !== viewer;
            if (i !== viewer) fig.model.update(p, p.vel, tNow);
        }
        _eye.set(p.x, p.y, p.z + (p.duck ? EYE_DUCK : EYE));
        if (fig.ray) {
            const pos = fig.ray.geometry.attributes.position;
            _end.copy(dirFrom(p.yaw, p.pitch)).multiplyScalar(900).add(_eye);
            pos.setXYZ(0, _eye.x, _eye.y, _eye.z);
            pos.setXYZ(1, _end.x, _end.y, _end.z);
            pos.needsUpdate = true;
            fig.ray.visible = i !== viewer;
        }
        if (i === viewer) view = { eye: _eye.clone(), yaw: p.yaw, pitch: p.pitch, p };
    }
    if (view) {
        camera.position.copy(view.eye);
        camera.lookAt(view.eye.clone().add(dirFrom(view.yaw, view.pitch)));
        if (viewModel) {
            viewModel.set(view.p.wkey, view.p.side);
            viewModel.update(!view.p.scoped, mode === 'me' ? lastShotKick(tNow) : 0);
        }
        // Zielfernrohr: Sichtfeld wie im Spiel enger (erste Zoomstufe ~ 40° horizontal)
        const fov = view.p.scoped ? 25 : VFOV;
        if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    } else {
        if (viewModel) viewModel.update(false, 0);
        if (camera.fov !== VFOV) { camera.fov = VFOV; camera.updateProjectionMatrix(); }
    }
    if (!view && !camFreeSet) {
        // Frei / Zuschauer: die beiden Duellanten von schraeg oben, mit der Maus drehbar
        const a = pose(A[mo.me_idx], B[mo.me_idx], f);
        const b = pose(A[mo.killer_idx], B[mo.killer_idx], f) || a;
        if (a) {
            // schraeg von oben auf die Mitte der beiden, Blick dorthin
            const tx = (a.x + b.x) / 2, ty = (a.y + b.y) / 2, tz = (a.z + b.z) / 2;
            camera.position.set(tx - 500, ty - 500, tz + 650);
            const dx = tx - camera.position.x, dy = ty - camera.position.y, dz = tz - camera.position.z;
            fly.yaw = Math.atan2(dy, dx) * 180 / Math.PI;
            fly.pitch = -Math.atan2(dz, Math.hypot(dx, dy)) * 180 / Math.PI;
        }
        camFreeSet = true;
    }
    if (!view) flyStep();
    renderer.render(scene, camera);
    aimOverlay(A, B, f, mode, view && view.p);
}

const _head = new THREE.Vector3();
function aimOverlay(A, B, f, m, viewerPose) {
    // Kopf des Gegners auf den Bildschirm projizieren, fuer die Aim-Einblendung (aim_trace_js)
    if (!window.kmAim) return;
    const mo = data.moment, cv = canvasEl();
    const w = cv.clientWidth, h = cv.clientHeight;
    let head = null;
    const k = mo.killer_idx != null ? pose(A[mo.killer_idx], B[mo.killer_idx], f) : null;
    if (k && m === 'me') {
        _head.set(k.x, k.y, k.z + (k.duck ? EYE_DUCK : EYE)).project(camera);
        if (_head.z < 1) head = { x: (_head.x + 1) / 2 * w, y: (1 - _head.y) / 2 * h };
    }
    const pxPerDeg = (h / 2) / Math.tan(camera.fov * Math.PI / 360) * Math.tan(Math.PI / 180);
    window.kmAim.frame(currentTick(), m, head, pxPerDeg, viewerPose);
}

function loop() {
    const layer = document.getElementById('km-3d-layer');
    if (mode === '2d' || layer.style.display === 'none' || !layer.offsetParent) { loopOn = false; return; }
    draw();
    requestAnimationFrame(loop);
}
function startLoop() { if (!loopOn) { loopOn = true; requestAnimationFrame(loop); } }

async function show(newMode) {
    mode = newMode;
    const km = window.km;
    const box = document.getElementById('km-3d-layer'), cv2d = document.getElementById('km-canvas');
    document.querySelectorAll('[data-km-view]').forEach(b => b.classList.toggle('btn-primary', b.dataset.kmView === newMode));
    if (newMode === '2d' || !km.data) { box.style.display = 'none'; cv2d.style.display = ''; km.dirty = true; return; }
    box.style.display = ''; cv2d.style.display = 'none';
    init();
    const msg = document.getElementById('km-3d-msg');
    try {
        if (!km.data.view3d) {
            msg.textContent = '3D-Daten werden geladen...';
            const r = await fetch(km.url + '&3d=1');
            const j = await r.json();
            if (!r.ok || !j.view3d) throw new Error(j.error || j.view3d_error || 'keine 3D-Daten');
            km.data.view3d = j.view3d;
            km.data.aim = j.aim; km.data.aim_error = j.aim_error;
            if (window.ktBuildEvents) window.ktBuildEvents();
        }
        const mk = km.data.map, parts = km.data.has_render || 0;
        if (renderReady[mk]) setWorld(renderReady[mk]);
        else {
            const rp = parts ? renderPromise(mk, parts) : null;
            if (km.data.has_geo !== false) {
                try { setWorld(await loadGeo(mk)); } catch (e) { if (!rp) throw e; }
            }
            if (rp) rp.then(g => { if (g && data && data.map === mk) setWorld(g); });
        }
        if (data !== km.data) {
            data = km.data; buildFigures();
            if (window.kmAim) window.kmAim.reset();
            msg.textContent = 'Spielermodelle werden geladen...';
            await buildModels();
        }
        msg.textContent = '';
        if (newMode === 'free') {
            camFreeSet = false;
            // beim ersten Mal die Steuerung zeigen
            const lg = document.getElementById('kt-legend');
            if (lg && !show.legendShown) { lg.style.display = 'block'; show.legendShown = true; }
        }
        resize();
        startLoop();
    } catch (e) { msg.textContent = e.message; }
}

window.km3d = {
    // vorab laden, sobald die Map bekannt ist (Liste der Momente) - spart beim ersten Klick die Downloadzeit
    prefetch: (mapKey, parts) => { if (parts) renderPromise(mapKey, parts); loadGeo(mapKey).catch(() => {}); },
    draw: () => {},   // die 3D-Schleife zeichnet selbst
    reset: () => { data = null; show(mode); },
    show,
};
document.querySelectorAll('[data-km-view]').forEach(b => b.addEventListener('click', () => show(b.dataset.kmView)));
document.getElementById('km-3d-full')?.addEventListener('click', () => {
    const box = document.getElementById('km-3d-wrap');
    if (document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen();
});
document.addEventListener('fullscreenchange', () => {
    requestAnimationFrame(() => { resize(); draw(); });
});
if (window.ResizeObserver) new ResizeObserver(() => { resize(); draw(); }).observe(canvasEl());
mode = 'me';   // Standard: Szene aus deinen Augen
</script>
