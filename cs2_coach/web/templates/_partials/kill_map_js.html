{% if kill_map_data %}
<script>
(function() {
    var mapData = {{ kill_map_data | tojson }};
    var canvas = document.getElementById('kill-map');
    if (!canvas || !mapData) return;

    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height, RADAR_SIZE = 1024, scale = W / RADAR_SIZE;
    var mode = 'dots', selectedRound = 0; // 0 = all rounds
    var totalRounds = mapData.total_rounds || 0;

    var img = new Image();
    img.src = '{{ url_for("static", filename="radars/") }}' + mapData.map + '.png';

    // Layer checkboxes
    var layers = {
        kills: document.getElementById('km-kills'),
        deaths: document.getElementById('km-deaths'),
        flash: document.getElementById('km-flash'),
        smoke: document.getElementById('km-smoke'),
        he: document.getElementById('km-he'),
        molotov: document.getElementById('km-molotov'),
    };
    var ownOnly = document.getElementById('km-own-only');

    // Round slider + pills
    var slider = document.getElementById('km-round-slider');
    var roundText = document.getElementById('km-round-text');
    var pillsContainer = document.getElementById('km-round-pills');

    // Build round pills
    if (totalRounds > 0) {
        var allPill = document.createElement('button');
        allPill.className = 'km-pill active';
        allPill.textContent = '∗';
        allPill.style.background = 'var(--color-neutral-700)'; allPill.style.color = '#fff';
        allPill.title = 'Alle Runden';
        allPill.onclick = function() { selectedRound = 0; slider.value = 0; updateRoundUI(); redraw(); };
        pillsContainer.appendChild(allPill);
        for (var r = 1; r <= totalRounds; r++) {
            var pill = document.createElement('button');
            pill.className = 'km-pill';
            pill.textContent = r;
            pill.dataset.round = r;
            // Color by half: CT blue first half, T gold second
            pill.style.background = r <= 12 ? 'rgba(126,170,219,0.2)' : 'rgba(222,178,62,0.2)';
            pill.style.color = r <= 12 ? '#7eaadb' : '#deb23e';
            (function(rn) { pill.onclick = function() { selectedRound = rn; slider.value = rn; updateRoundUI(); redraw(); }; })(r);
            pillsContainer.appendChild(pill);
        }
    }

    function updateRoundUI() {
        roundText.textContent = selectedRound === 0 ? 'Alle Runden' : 'Runde ' + selectedRound;
        var pills = pillsContainer.querySelectorAll('.km-pill');
        pills.forEach(function(p) {
            var pr = parseInt(p.dataset.round) || 0;
            p.classList.toggle('active', pr === selectedRound || (selectedRound === 0 && !p.dataset.round));
        });
    }

    slider.addEventListener('input', function() { selectedRound = parseInt(this.value); updateRoundUI(); redraw(); });

    // Mode buttons
    document.querySelectorAll('.km-mode').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.km-mode').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            mode = this.dataset.mode;
            redraw();
        });
    });

    // Layer change listeners
    Object.values(layers).concat([ownOnly]).forEach(function(cb) { cb.addEventListener('change', redraw); });

    function hex2rgba(hex, a) {
        var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return 'rgba('+r+','+g+','+b+','+a+')';
    }

    var utilColors = { flash: '#60a5fa', smoke: '#a3a3a3', he: '#fb923c', molotov: '#ef4444' };
    var utilSymbols = { flash: '⚡', smoke: '●', he: '💥', molotov: '🔥' };

    function getFilteredDots() {
        var dots = [];
        if (!mapData.dots) return dots;
        for (var i = 0; i < mapData.dots.length; i++) {
            var d = mapData.dots[i];
            if (selectedRound > 0 && d.round !== selectedRound) continue;
            if (d.type === 'kill' && !layers.kills.checked) continue;
            if (d.type === 'death' && !layers.deaths.checked) continue;
            dots.push(d);
        }
        return dots;
    }

    function getFilteredUtils() {
        var utils = [];
        if (!mapData.utils) return utils;
        for (var i = 0; i < mapData.utils.length; i++) {
            var u = mapData.utils[i];
            if (selectedRound > 0 && u.round !== selectedRound) continue;
            if (!layers[u.type] || !layers[u.type].checked) continue;
            if (ownOnly.checked && !u.is_own) continue;
            utils.push(u);
        }
        return utils;
    }

    function drawDots(dots, utils) {
        // Draw utility first (below kills)
        for (var u = 0; u < utils.length; u++) {
            var ut = utils[u], ux = ut.x * scale, uy = ut.y * scale;
            if (ux < 0 || ux > W || uy < 0 || uy > H) continue;
            var uc = utilColors[ut.type] || '#888';
            // Glow
            var ug = ctx.createRadialGradient(ux, uy, 0, ux, uy, 14);
            ug.addColorStop(0, hex2rgba(uc, 0.25)); ug.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.arc(ux, uy, 14, 0, Math.PI * 2); ctx.fillStyle = ug; ctx.fill();
            // Diamond shape for utility
            ctx.beginPath();
            ctx.moveTo(ux, uy - 5); ctx.lineTo(ux + 4, uy); ctx.lineTo(ux, uy + 5); ctx.lineTo(ux - 4, uy);
            ctx.closePath(); ctx.fillStyle = uc; ctx.globalAlpha = ut.is_own ? 0.9 : 0.4; ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        // Deaths first (below kills)
        var deaths = [], kills = [];
        for (var i = 0; i < dots.length; i++) {
            if (dots[i].type === 'death') deaths.push(dots[i]); else kills.push(dots[i]);
        }
        function drawKillDot(d) {
            var x = d.x * scale, y = d.y * scale;
            if (x < 0 || x > W || y < 0 || y > H) return;
            var color = d.type === 'kill' ? (d.headshot ? '#fbbf24' : '#4ade80') : '#f87171';
            var radius = d.headshot ? 6 : 5;
            var grad = ctx.createRadialGradient(x, y, 0, x, y, radius + 8);
            grad.addColorStop(0, hex2rgba(color, 0.35)); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.arc(x, y, radius + 8, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
            if (d.type === 'death') {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
                ctx.beginPath(); ctx.moveTo(x-5,y-5); ctx.lineTo(x+5,y+5); ctx.moveTo(x+5,y-5); ctx.lineTo(x-5,y+5); ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
        }
        deaths.forEach(drawKillDot); kills.forEach(drawKillDot);
    }

    function drawHeatmap(dots) {
        // Off-screen canvas for heatmap
        var hc = document.createElement('canvas'); hc.width = W; hc.height = H;
        var hctx = hc.getContext('2d');
        for (var i = 0; i < dots.length; i++) {
            var d = dots[i], x = d.x * scale, y = d.y * scale;
            if (x < 0 || x > W || y < 0 || y > H) continue;
            var r = 28;
            var g = hctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
            hctx.beginPath(); hctx.arc(x, y, r, 0, Math.PI * 2); hctx.fillStyle = g; hctx.fill();
        }
        // Colorize: get pixel data, map brightness to color
        var imageData = hctx.getImageData(0, 0, W, H);
        var pix = imageData.data;
        for (var p = 0; p < pix.length; p += 4) {
            var v = pix[p + 3]; // alpha = intensity
            if (v < 5) { pix[p+3] = 0; continue; }
            var t = v / 255;
            // Blue -> Cyan -> Green -> Yellow -> Red
            var r2, g2, b2;
            if (t < 0.25) { r2 = 0; g2 = Math.round(t/0.25*255); b2 = 255; }
            else if (t < 0.5) { r2 = 0; g2 = 255; b2 = Math.round((1-(t-0.25)/0.25)*255); }
            else if (t < 0.75) { r2 = Math.round((t-0.5)/0.25*255); g2 = 255; b2 = 0; }
            else { r2 = 255; g2 = Math.round((1-(t-0.75)/0.25)*255); b2 = 0; }
            pix[p] = r2; pix[p+1] = g2; pix[p+2] = b2; pix[p+3] = Math.min(200, v * 2);
        }
        hctx.putImageData(imageData, 0, 0);
        ctx.globalAlpha = 0.7; ctx.drawImage(hc, 0, 0); ctx.globalAlpha = 1.0;
    }

    function redraw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, 0, W, H);
        if (img.complete && img.naturalWidth > 0) {
            ctx.globalAlpha = 0.7; ctx.drawImage(img, 0, 0, W, H); ctx.globalAlpha = 1.0;
        }
        var dots = getFilteredDots();
        var utils = getFilteredUtils();
        if (mode === 'heatmap') {
            drawHeatmap(dots.concat(utils.map(function(u) { return {x: u.x, y: u.y}; })));
        } else {
            drawDots(dots, utils);
        }
        // Map name watermark
        ctx.font = '500 11px Inter, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.textAlign = 'right';
        ctx.fillText(mapData.map.toUpperCase() + (selectedRound > 0 ? ' R' + selectedRound : ''), W - 10, H - 10);
    }

    img.onload = redraw; img.onerror = redraw;
    if (img.complete) redraw();

    // Tooltip
    var tooltip = document.getElementById('kill-map-tooltip');
    var allItems = [];
    canvas.addEventListener('mousemove', function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (H / rect.height);
        // Search dots then utils
        var found = null;
        var dots = getFilteredDots();
        for (var i = 0; i < dots.length; i++) {
            var d = dots[i], dx = d.x*scale - mx, dy = d.y*scale - my;
            if (dx*dx + dy*dy < 144) { found = {label: d.label + (d.weapon ? ' (' + d.weapon + ')' : ''), round: d.round}; break; }
        }
        if (!found) {
            var utils = getFilteredUtils();
            for (var j = 0; j < utils.length; j++) {
                var u = utils[j], udx = u.x*scale - mx, udy = u.y*scale - my;
                if (udx*udx + udy*udy < 196) {
                    var utype = {flash:'Flash',smoke:'Smoke',he:'HE',molotov:'Molotov'}[u.type] || u.type;
                    found = {label: utype + ': ' + u.player, round: u.round}; break;
                }
            }
        }
        if (found) {
            tooltip.textContent = found.label + ' (R' + found.round + ')';
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
            tooltip.style.top = (e.clientY - rect.top - 20) + 'px';
        } else { tooltip.style.display = 'none'; }
    });
    canvas.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });
})();
</script>
{% endif %}
