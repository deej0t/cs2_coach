<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CS2 Coach{% endblock %}</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text2: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --orange: #db6d28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        nav {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        nav .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        nav a {
            color: var(--text2);
            text-decoration: none;
            font-size: 0.9rem;
        }
        nav a:hover, nav a.active { color: var(--text); }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 { font-size: 1.75rem; margin-bottom: 1rem; }
        h2 { font-size: 1.35rem; margin: 1.5rem 0 0.75rem; color: var(--accent); }
        h3 { font-size: 1.1rem; margin: 1rem 0 0.5rem; }
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .flash {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .flash.error { background: rgba(248,81,73,0.15); border: 1px solid var(--red); color: var(--red); }
        .flash.success { background: rgba(63,185,80,0.15); border: 1px solid var(--green); color: var(--green); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5rem 0;
        }
        th, td {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text2); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        tr:hover td { background: var(--bg3); }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--border); }
        .btn-primary { background: #238636; border-color: #2ea043; }
        .btn-primary:hover { background: #2ea043; }
        input[type="text"], input[type="file"], select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
        }
        input[type="file"] { padding: 0.4rem; }
        label { display: block; margin-bottom: 0.25rem; color: var(--text2); font-size: 0.85rem; }
        .form-group { margin-bottom: 1rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
        .stat-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            text-align: center;
        }
        .stat-box .value { font-size: 1.75rem; font-weight: 700; }
        .stat-box .label { font-size: 0.8rem; color: var(--text2); margin-top: 0.25rem; }
        .win { color: var(--green); }
        .loss { color: var(--red); }
        .draw { color: var(--yellow); }
        .coach-report {
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .coach-report h2 { font-size: 1.2rem; }
        .coach-report h3 { font-size: 1rem; color: var(--yellow); }
        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: var(--text2);
            border-bottom: 2px solid transparent;
            font-size: 0.9rem;
        }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-win { background: rgba(63,185,80,0.2); color: var(--green); }
        .badge-loss { background: rgba(248,81,73,0.2); color: var(--red); }
        .badge-draw { background: rgba(210,153,34,0.2); color: var(--yellow); }
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            nav { padding: 0.75rem 1rem; gap: 1rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}" class="logo">CS2 Coach</a>
        <a href="{{ url_for('index') }}">Analyse</a>
        <a href="{{ url_for('exports') }}">Exports</a>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
