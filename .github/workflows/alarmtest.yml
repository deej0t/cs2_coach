# Probealarm von Hand: schlaegt absichtlich fehl, damit sich pruefen
# laesst, ob die Fehler-E-Mail von GitHub ankommt.
# Ausloesen: Actions -> "Alarmtest" -> "Run workflow".
#
# Zuerst lief er zeitgesteuert alle 5 Minuten - nach dem Einschalten von
# Actions haette er alle 5 Minuten eine Fehler-Mail ausgeloest.
name: Alarmtest

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Probealarm::Das ist nur ein Test. So sieht die Mail aus, wenn CS2 Coach nicht erreichbar ist."
          exit 1
